<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>webland — Home</title>
  <link rel="canonical" href="https://github.com/Hamedghz/webland">
  <!-- OpenGraph -->
  <meta property="og:title" content="webland">
  <meta property="og:description" content="Web land">
  <meta property="og:type" content="website">
  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">

  <!-- JSON-LD (example) -->
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"Restaurant","name":"webland","url":"https://github.com/Hamedghz/webland"}
  </script>

  <link rel="stylesheet" href="/assets/css/base/variables.css">
  <link rel="stylesheet" href="/assets/css/base/typography.css">
  <link rel="stylesheet" href="/assets/css/components/buttons.css">
  <link rel="stylesheet" href="/assets/css/layout/header.css">
  <link rel="stylesheet" href="/assets/css/components/bottom-nav.css">
  <link rel="stylesheet" href="/assets/css/pages/home.css">
  <link rel="stylesheet" href="/assets/css/responsive.css">

  <meta name="color-scheme" content="light dark">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header role="banner">
    <nav role="navigation" aria-label="Primary" class="site-nav">
      <a href="#home" class="logo">webland</a>
    </nav>
  </header>

  <main id="main">
    <section aria-labelledby="hero-heading" class="hero">
      <h1 id="hero-heading" class="visually-hidden">Hero Carousel</h1>

      <div class="carousel" data-carousel>
        <div class="carousel-track">
          <div class="carousel-slide" role="group" aria-roledescription="slide" aria-label="1 of 3" style="--index:0">
            <div class="img-wrap" style="aspect-ratio:16/9">
              <img data-src="/assets/images/slide1.jpg" alt="Slide 1" loading="lazy" decoding="async">
            </div>
            <div class="carousel-caption">Slide 1</div>
          </div>

          <div class="carousel-slide" role="group" aria-roledescription="slide" aria-label="2 of 3" style="--index:1">
            <div class="img-wrap" style="aspect-ratio:16/9">
              <img data-src="/assets/images/slide2.jpg" alt="Slide 2" loading="lazy" decoding="async">
            </div>
            <div class="carousel-caption">Slide 2</div>
          </div>

          <div class="carousel-slide" role="group" aria-roledescription="slide" aria-label="3 of 3" style="--index:2">
            <div class="img-wrap" style="aspect-ratio:16/9">
              <img data-src="/assets/images/slide3.jpg" alt="Slide 3" loading="lazy" decoding="async">
            </div>
            <div class="carousel-caption">Slide 3</div>
          </div>
        </div>

        <button class="carousel-prev" aria-controls="carousel" aria-label="Previous slide">◀</button>
        <button class="carousel-next" aria-controls="carousel" aria-label="Next slide">▶</button>
      </div>
    </section>

    <section id="content" class="content">
      <h2>Welcome</h2>
      <p>Starter scaffold for webland.</p>
    </section>
  </main>

  <footer role="contentinfo">
    <p>&copy; webland</p>
  </footer>

  <nav class="bottom-nav" role="navigation" aria-label="Bottom Navigation" data-bottom-nav>
    <a href="#home" data-target="#home">خانه</a>
    <a href="#content" data-target="#content">محتوا</a>
    <a href="#contact" data-target="#contact">تماس</a>
  </nav>

  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
